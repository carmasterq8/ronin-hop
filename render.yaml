# Ronin Hop contest: score server + its database on Render.
services:
  - type: web
    name: ronin-hop-contest-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ronin-hop-contest
          property: connectionString
      - key: TOKEN_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: CONTEST_END
        value: "2026-11-30T23:59:59+03:00"
      - key: ALLOWED_ORIGINS
        value: https://play.muriegarage.com,http://play.muriegarage.com,https://carmasterq8.github.io
databases:
  - name: ronin-hop-contest
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    diskSizeGB: 1
